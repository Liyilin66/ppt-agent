name: tests

# No real model calls and no API keys: the tests use mock clients.
#
# The full suite runs on Ubuntu and on macOS. Each job first checks that a Chromium browser is
# there, so the tests that measure pages in a browser cannot skip silently.
# Tests skip themselves, with the reason printed (-rs), only where something they need is not in
# the repository or on the runner:
# - a source PDF (third-party reports are not committed);
# - the Microsoft Office fonts that a few layout thresholds were measured with. Slides are shown in
#   PowerPoint, so pages are measured with Office's Chinese fonts; runners have no Office, and with the
#   stand-in fonts one known-good page measured a 10px gap against a 12px threshold and one line broke
#   elsewhere (first CI runs, 2026-11-19). The other browser tests run everywhere.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CJK fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies (Python 3.11, locked)
        run: uv sync --locked --python 3.11

      - name: Require a Chromium browser for the layout tests
        run: uv run --python 3.11 python -c "from ppt_agent.v2.htmldeck import browser; assert browser.available(), 'no Chromium-based browser on this runner'"

      - name: Run the full test suite
        run: uv run --python 3.11 pytest -p no:cacheprovider -q -rs
