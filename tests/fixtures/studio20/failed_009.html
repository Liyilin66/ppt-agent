    <div class="t1">先看数据、边界<br>与可验证价值</div>
    <div class="b">优先选择数据可用、边界清晰且效果可验证的业务任务。</div>
    <div class="r lb" style="grid-column:1/7;grid-row:7/9">
      <div class="t3">高要求场景仍待探索</div>
      <div class="s">可解释、确定性、实时性要求高，场景动态性高或样本数据不易获取时，大模型有效应用仍需进一步探索。</div>
    </div>
  </div>

  <div class="r spread ink pad bleed-r" style="grid-column:7/13;grid-row:3/9">

        </div>
        <div class="g1">
          <div class="t3">低匹配度</div>
          <div class="b">数据难获取<br>要求确定</div>
        </div>
