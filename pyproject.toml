[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent"
version = "0.1.0"
description = "A minimal first milestone for an AI Presentation Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.1,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "uvicorn>=0.38,<1",
]

[project.scripts]
ppt-agent = "ppt_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
