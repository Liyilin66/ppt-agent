    <h1 class="title">大模型落地按“选、建、用、管”四步推进，风险管理贯穿始终</h1>
    <p class="lead">多数企业的问题不在某一步做不到，而在四步之间没有接上。</p>
  </div>
  <div class="body col">
    <div class="row f1 stretch">
      <div class="card f1"><div class="stat s">01</div><div class="h l">选</div><div class="p muted">梳理业务需求，决定模型生态、部署方式和算力规模</div></div>
      <div class="card f1"><div class="stat s">02</div><div class="h l">建</div><div class="p muted">统一纳管算力，开发流水线和 AI 资产，形成能力平台</div></div>
      <div class="card f1"><div class="stat s">03</div><div class="h l">用</div><div class="p muted">通过工具调用、工作流和人机交互放大模型价值</div></div>
      <div class="panel f1"><div class="stat s">04</div><div class="h l">管</div><div class="p muted">用 MLOps 持续迭代，风险识别、评估、应对贯穿全流程</div></div>
